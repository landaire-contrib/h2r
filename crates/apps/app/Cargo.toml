[package]
name = "app"
description = "Host shell for h2recomp: window, presentation, live input, audio device and guest-thread lifecycle (macOS first)"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["gamepads"]
# GameController on macOS, gilrs elsewhere.
gamepads = ["game-controller", "input/gilrs", "input/hid"]
# GameController alone: what tvOS builds with (no gilrs or IOKit HID there).
game-controller = ["input/game-controller"]

[dependencies]
gfx = { path = "../../platform/gfx" }
input = { path = "../../platform/input", default-features = false }
audio = { path = "../../platform/audio" }
xapi = { path = "../../platform/xapi" }
timeline = { path = "../../runtime/timeline" }
debug-menu = { path = "../../extensions/debug-menu" }
wgpu = "30"
cpal = "0.18"
pollster = "1"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
thiserror.workspace = true
anyhow.workspace = true

# winit has no tvOS backend; the tvOS app hosts the shell itself
# (src/embedded.rs, platform/tvos).
[target.'cfg(not(any(target_os = "tvos", target_os = "ios")))'.dependencies]
winit = "0.30"
png = "0.18"

# The Steam client's command pipe (src/steam_keyboard.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The Dock icon for the unbundled `h2 play` window (art/app-icon).
[target.'cfg(target_os = "macos")'.dependencies]
app-icon = { path = "../app-icon" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction"] }

[[bin]]
name = "h2-app-demo"
path = "src/bin/demo.rs"

[dev-dependencies]
lockstep = { path = "../../extensions/lockstep" }

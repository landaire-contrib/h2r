# Reads the generated third-party/rust/Cargo.toml, which lists every external
# dependency of the workspace including dev-dependencies. Reindeer does not
# follow the dev-dependencies of workspace members, and the Buck test targets
# need them. Run scripts/update-buck.py instead of reindeer directly.
manifest_path = "third-party/rust/Cargo.toml"
third_party_dir = "third-party/rust"

# Crates are fetched from crates.io by SHA-256 at build time instead of being
# committed.
vendor = false

cargo_env = [
    "CARGO_CRATE_NAME",
    "CARGO_MANIFEST_DIR",
    "CARGO_PKG_AUTHORS",
    "CARGO_PKG_DESCRIPTION",
    "CARGO_PKG_NAME",
    "CARGO_PKG_REPOSITORY",
    "CARGO_PKG_VERSION",
    "CARGO_PKG_VERSION_MAJOR",
    "CARGO_PKG_VERSION_MINOR",
    "CARGO_PKG_VERSION_PATCH",
    "CARGO_PKG_VERSION_PRE",
]

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("//build-support/buck:third_party_rules.bzl", "buildscript_run", "cargo")
"""
generated_file_header = """
# @generated by Reindeer. Do not edit by hand.
# Run scripts/update-buck.py after changing Cargo.toml or Cargo.lock.
"""

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"

[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.macos-x86_64]
target = "x86_64-apple-darwin"

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"
